[project]
name = "systemone-proxy"
version = "0.2.0"
description = "Serve calibrated decision models (Quyet, Rune, Xor, Bobcat, h2o-lightning) behind one /v1/systemone API on top of llama-server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Alexandru Gherghina", email = "alexandru.gherghina.p@gmail.com" },
]
dependencies = [
    "huggingface_hub>=0.24",
    "pillow>=10",
    "tokenizers>=0.20",
]

[project.scripts]
systemone-proxy = "systemone_proxy.cli:main"

[dependency-groups]
dev = ["pytest>=8", "jinja2>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/systemone_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
