[project]
name = "llm-runner"
version = "1.12.0"
description = "Run local model servers (llama-server, vLLM, SGLang) on hosts or in containers, behind one OpenAI-compatible gateway."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alexandru Gherghina", email = "alexandru.gherghina.p@gmail.com" },
]
dependencies = [
    "click>=8.1",
    "huggingface_hub>=0.24",
    "prompt_toolkit>=3.0",
    "questionary>=2.0",
    "pyyaml>=6.0",
    "pillow>=10",
]

[project.scripts]
llmctl = "llm_runner.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_runner"]

[dependency-groups]
dev = [
    "numpy>=2.4.6",
    "onnxruntime>=1.31.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
